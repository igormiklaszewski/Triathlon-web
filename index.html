<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triathlon">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Triathlon</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2b303b;--txt:#eef0f4;--mut:#8b93a3;--acc:#ff7a1a;--ok:#2fbf71;--warn:#f5c542;--bad:#ff6b6b;
  --swim:#38bdf8;--bike:#f5c542;--run:#2fbf71;--ctl:#38bdf8;--atl:#ff7a1a;--tsb:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 0;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:var(--txt)}
#app{max-width:880px;margin:0 auto;padding:12px 12px calc(86px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 4px 2px}
h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{margin:0 4px 12px;color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kpi{background:var(--card2);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:12px;color:var(--mut)}
.kpi small{display:block;font-size:12px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
canvas{width:100%;height:190px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.act{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#111}
.act .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .m{font-size:13px;color:var(--mut)}
.act .t{text-align:right;font-weight:700}
.act .t small{display:block;color:var(--mut);font-weight:400;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}td:first-child,th:first-child{text-align:left}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],textarea{width:100%;background:var(--card2);border:0;border-radius:10px;padding:11px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--acc);color:#111;font-weight:700;margin-top:10px}
.btn.sec{background:var(--card2);color:var(--txt)}.btn.red{color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--card2)}
.banner{background:#3a2a10;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(24,27,34,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:10px 0 9px;color:var(--mut);font-size:11px;font-weight:600}
nav button b{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script src="analysis.js"></script>
<script src="demo.js"></script>
<script>
const T = Tri;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const COL = { swim: '#38bdf8', bike: '#f5c542', run: '#2fbf71', multi: '#a78bfa', other: '#8b93a3' };
const LBL = { swim: 'P', bike: 'R', run: 'B', multi: 'T', other: '·' };
const NAMES = { swim: 'Pływanie', bike: 'Rower', run: 'Bieg', multi: 'Triathlon', other: 'Inne' };
const GH_PATH = 'triathlon/data/';

let set = Object.assign({}, T.DEFAULTS, store.get('tri_set', {}));
let cfg = store.get('tri_gh', null);
let raw = null, acts = [], series = [], wellness = [], status = '', tab = store.get('tri_tab', 'home');
const today = () => T.dkey(new Date());

// ---------- dane ----------
function ghHeaders(raw) { return { Authorization: 'Bearer ' + cfg.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; }

async function loadData(manual) {
  if (cfg) {
    try {
      const r = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${GH_PATH}garmin.json`, { headers: ghHeaders(true), cache: 'no-store' });
      if (r.status === 404) throw new Error('Brak pliku garmin.json – uruchom workflow „Garmin sync”');
      if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'Brak dostępu – sprawdź token' : 'Błąd GitHub ' + r.status);
      raw = await r.json(); store.set('tri_data', raw); status = '';
    } catch (e) { status = e.message; raw = store.get('tri_data', null); }
  } else raw = store.get('tri_data', null);
  if (!raw) raw = TriDemo.make(today());
  compute(); render();
  if (manual && !raw.demo && !status) publishSummary(true);
}

function compute() {
  acts = T.dedupe((raw.activities || []).map(T.normalize));
  series = T.pmc(acts, set, today());
  wellness = (raw.wellness || []).slice().sort((a, b) => a.date.localeCompare(b.date));
}

// Podsumowanie dla widżetu iOS (Scriptable) – zapisywane do repo jako summary.json.
function buildSummary() {
  const last = series[series.length - 1] || { ctl: 0, atl: 0, tsb: 0 };
  const wk = T.weekly(acts, set), cur = wk.find(w => w.week === T.weekStart(today())) || { tss: 0, hours: 0, swim: 0, bike: 0, run: 0 };
  const la = acts[acts.length - 1], w = wellness[wellness.length - 1] || {};
  return {
    updated: new Date().toISOString(), ctl: +last.ctl.toFixed(1), atl: +last.atl.toFixed(1), tsb: +(last.ctl - last.atl).toFixed(1),
    state: T.formState(last.ctl - last.atl).label, ramp: +T.rampRate(series).toFixed(1),
    week: { tss: Math.round(cur.tss), hours: +cur.hours.toFixed(1), swim: +cur.swim.toFixed(1), bike: +cur.bike.toFixed(1), run: +cur.run.toFixed(1) },
    last: la && { date: la.date, name: la.name, sport: la.sport, min: Math.round(la.dur / 60), km: +(la.dist / 1000).toFixed(1) },
    hrv: w.hrv || null, rhr: w.rhr || null, sleep: w.sleep || null,
    race: set.raceDate ? { date: set.raceDate, days: T.daysBetween(today(), set.raceDate) } : null,
  };
}

async function publishSummary(silent) {
  if (!cfg || raw.demo) return;
  try {
    const url = `https://api.github.com/repos/${cfg.repo}/contents/${GH_PATH}summary.json`;
    const g = await fetch(url, { headers: ghHeaders(false), cache: 'no-store' });
    const sha = g.ok ? (await g.json()).sha : undefined;
    const body = btoa(unescape(encodeURIComponent(JSON.stringify(buildSummary(), null, 1))));
    const p = await fetch(url, { method: 'PUT', headers: ghHeaders(false), body: JSON.stringify({ message: 'Podsumowanie dla widżetu', content: body, sha }) });
    if (!p.ok) throw new Error(p.status === 403 || p.status === 404 ? 'Token nie ma prawa zapisu (Contents: Read and write)' : 'Błąd zapisu ' + p.status);
    if (!silent) toast('Widżet zaktualizowany');
  } catch (e) { if (!silent) toast(e.message); }
}

// ---------- wykresy ----------
function setup(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr); c.font = '11px -apple-system,system-ui,sans-serif';
  return { c, w, h, l: 34, r: 8, t: 8, b: 20 };
}
function axes(g, min, max, labels, n) {
  const { c, w, h, l, r, t, b } = g;
  c.strokeStyle = '#2b303b'; c.fillStyle = '#8b93a3'; c.lineWidth = 1; c.textAlign = 'right';
  const step = niceStep((max - min) / 4);
  for (let v = Math.ceil(min / step) * step; v <= max; v += step) {
    const y = t + (h - t - b) * (1 - (v - min) / (max - min));
    c.beginPath(); c.moveTo(l, y); c.lineTo(w - r, y); c.stroke(); c.fillText(Math.round(v * 10) / 10, l - 4, y + 4);
  }
  c.textAlign = 'center';
  const every = Math.max(1, Math.ceil(labels.length / 6));
  labels.forEach((s, i) => { if (i % every === 0) c.fillText(s, l + (w - l - r) * (n > 1 ? i / (n - 1) : 0.5), h - 5); });
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))), f = x / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

function lineChart(cv, labels, lines, opt = {}) {
  const g = setup(cv), { c, w, h, l, r, t, b } = g;
  const all = lines.flatMap(s => s.v).filter(v => v != null);
  if (!all.length) return;
  let min = opt.min != null ? opt.min : Math.min(...all), max = Math.max(...all);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.08; if (opt.min == null) min -= pad; max += pad;
  axes(g, min, max, labels, labels.length);
  const X = i => l + (w - l - r) * (labels.length > 1 ? i / (labels.length - 1) : 0.5), Y = v => t + (h - t - b) * (1 - (v - min) / (max - min));
  if (min < 0 && max > 0) { c.strokeStyle = '#555c6b'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(l, Y(0)); c.lineTo(w - r, Y(0)); c.stroke(); c.setLineDash([]); }
  lines.forEach(s => {
    c.strokeStyle = s.color; c.lineWidth = s.w || 2; c.globalAlpha = s.alpha || 1; c.beginPath();
    let on = false; s.v.forEach((v, i) => { if (v == null) { on = false; return; } on ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)); on = true; });
    c.stroke(); c.globalAlpha = 1;
    if (s.dots) s.v.forEach((v, i) => { if (v == null) return; c.fillStyle = s.color; c.globalAlpha = .45; c.beginPath(); c.arc(X(i), Y(v), 2.5, 0, 7); c.fill(); c.globalAlpha = 1; });
  });
  if (opt.vline != null && opt.vline >= 0 && opt.vline < labels.length) { c.strokeStyle = '#ff7a1a'; c.setLineDash([4, 3]); c.beginPath(); c.moveTo(X(opt.vline), t); c.lineTo(X(opt.vline), h - b); c.stroke(); c.setLineDash([]); }
}

function barChart(cv, labels, stacks) {
  const g = setup(cv), { c, w, h, l, r, t, b } = g;
  const tot = labels.map((_, i) => stacks.reduce((a, s) => a + s.v[i], 0)), max = Math.max(1, ...tot) * 1.08;
  axes(g, 0, max, labels, labels.length);
  const bw = (w - l - r) / labels.length;
  labels.forEach((_, i) => {
    let y = h - b;
    stacks.forEach(s => { const bh = (h - t - b) * s.v[i] / max; c.fillStyle = s.color; c.fillRect(l + i * bw + bw * .15, y - bh, bw * .7, bh); y -= bh; });
  });
}

// ---------- widoki ----------
const TABS = [['home', '◉', 'Przegląd'], ['form', '∿', 'Forma'], ['acts', '☰', 'Treningi'], ['rec', '♥', 'Regeneracja'], ['est', '⚑', 'Prognozy'], ['set', '⚙', 'Ustawienia']];
const f1 = v => v == null || isNaN(v) ? '–' : (Math.round(v * 10) / 10).toString();
const delta = (n, p, inv) => { if (n == null || p == null) return ''; const d = n - p, good = inv ? d < 0 : d > 0; return `<small class="${Math.abs(d) < .05 ? 'mut' : good ? 'up' : 'down'}">${d > 0 ? '▲' : d < 0 ? '▼' : '='} ${f1(Math.abs(d))} vs poprz.</small>`; };
const kpi = (v, l, extra = '') => `<div class="kpi"><b>${v}</b><span>${l}</span>${extra}</div>`;
const legend = items => `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const lastN = (a, n) => a.slice(-n);
const short = d => d.slice(8) + '.' + d.slice(5, 7);

function actRow(a) {
  const t = T.tss(a, set), pace = a.sport === 'run' && a.dist ? T.fmtPace(a.dur / (a.dist / 1000)) + '/km' : a.sport === 'swim' && a.dist ? T.fmtPace(a.dur / (a.dist / 100)) + '/100m' : a.sport === 'bike' && a.dist ? f1(a.dist / a.dur * 3.6) + ' km/h' : '';
  return `<div class="act"><div class="ic" style="background:${COL[a.sport]}">${LBL[a.sport]}</div>
    <div style="min-width:0"><div class="n">${esc(a.name || NAMES[a.sport])}</div><div class="m">${a.date.slice(5).replace('-', '.')} · ${T.fmtTime(a.dur)} · ${a.dist ? f1(a.dist / 1000) + ' km' : ''} ${pace ? '· ' + pace : ''} ${a.hr ? '· ♥' + Math.round(a.hr) : ''}${a.np ? ' · ' + Math.round(a.np) + ' W' : ''}</div></div>
    <div class="t">${Math.round(t)}<small>TSS</small></div></div>`;
}

const views = {
  home() {
    const last = series[series.length - 1] || { ctl: 0, atl: 0, tsb: 0 }, tsb = last.ctl - last.atl, st = T.formState(tsb), ramp = T.rampRate(series);
    const wk = T.weekly(acts, set), cur = wk.find(w => w.week === T.weekStart(today())) || { tss: 0, hours: 0, swim: 0, bike: 0, run: 0 }, prev = wk.find(w => w.week === T.addDays(T.weekStart(today()), -7));
    const w = wellness[wellness.length - 1] || {}, hrv7 = T.trend(wellness.map(x => x.hrv), 7);
    const race = set.raceDate ? T.daysBetween(today(), set.raceDate) : null;
    return `<div class="card"><h2>Forma</h2><div class="grid">
      ${kpi(Math.round(last.ctl), 'CTL – kondycja')}${kpi(Math.round(last.atl), 'ATL – zmęczenie')}${kpi(Math.round(tsb), 'TSB – świeżość')}${kpi((ramp > 0 ? '+' : '') + f1(ramp), 'Ramp / tydz.', ramp > 8 ? '<small class="down">za szybki wzrost</small>' : '')}</div>
      <p style="margin:12px 0 0"><span class="pill" style="color:var(--tsb)">${st.label}</span> <span class="mut">${st.hint}</span></p>
      ${race != null && race >= 0 ? `<p class="mut" style="margin:8px 0 0">Do startu: <b style="color:var(--txt)">${race} dni</b> (${set.raceDate})</p>` : ''}</div>
    <div class="card"><h2>Ten tydzień</h2><div class="grid">
      ${kpi(Math.round(cur.tss), 'TSS', delta(cur.tss, prev && prev.tss))}${kpi(f1(cur.hours) + ' h', 'czas', delta(cur.hours, prev && prev.hours))}
      ${kpi(f1(cur.swim) + ' h', 'pływanie')}${kpi(f1(cur.bike) + ' h', 'rower')}${kpi(f1(cur.run) + ' h', 'bieg')}</div></div>
    <div class="card"><h2>Regeneracja (ostatni odczyt)</h2><div class="grid">
      ${kpi(w.hrv || '–', 'HRV [ms]', hrv7 ? delta(hrv7.now, hrv7.prev) : '')}${kpi(w.rhr || '–', 'tętno spocz.')}${kpi(w.sleep || '–', 'sen (wynik)')}${kpi(w.bb || '–', 'Body Battery')}</div></div>
    <div class="card"><h2>Ostatnie treningi</h2>${lastN(acts, 5).reverse().map(actRow).join('') || '<p class="mut">Brak aktywności.</p>'}</div>`;
  },
  form() {
    const s = lastN(series, 90), wk = lastN(T.weekly(acts, set), 12);
    return `<div class="card"><h2>Performance Management Chart</h2><canvas id="c-pmc"></canvas>${legend([[COL_CTL, 'CTL'], [COL_ATL, 'ATL'], [COL_TSB, 'TSB']])}
      <p class="mut" style="margin:8px 0 0">CTL = średnie obciążenie z 42 dni, ATL = z 7 dni, TSB = CTL − ATL. TSS jest szacowany z progów w Ustawieniach.</p></div>
    <div class="card"><h2>Godziny tygodniowo</h2><canvas id="c-wk"></canvas>${legend([[COL.swim, 'pływanie'], [COL.bike, 'rower'], [COL.run, 'bieg'], [COL.multi, 'start']])}</div>
    <div class="card"><h2>Tygodnie</h2><table><tr><th>Tydzień</th><th>h</th><th>TSS</th><th>Pływ. km</th><th>Rower km</th><th>Bieg km</th></tr>
      ${wk.slice().reverse().map(w => `<tr><td>${short(w.week)}</td><td>${f1(w.hours)}</td><td>${Math.round(w.tss)}</td><td>${f1(w.dist.swim / 1000)}</td><td>${f1(w.dist.bike / 1000)}</td><td>${f1(w.dist.run / 1000)}</td></tr>`).join('')}</table></div>`;
  },
  acts() {
    return `<div class="card"><h2>Treningi (${acts.length})</h2>${acts.slice().reverse().slice(0, 60).map(actRow).join('') || '<p class="mut">Brak aktywności.</p>'}</div>`;
  },
  rec() {
    const hrvT = T.trend(wellness.map(x => x.hrv), 7), vo = wellness.map(x => x.vo2).filter(Boolean);
    return `<div class="card"><h2>HRV (nocna średnia)</h2><canvas id="c-hrv"></canvas>${legend([['#a78bfa', 'HRV'], ['#eef0f4', 'średnia 7 dni']])}
      ${hrvT ? `<p class="mut" style="margin:8px 0 0">Średnia 7 dni: <b style="color:var(--txt)">${f1(hrvT.now)} ms</b> (poprzednio ${f1(hrvT.prev)}). Trwały spadek przy rosnącym tętnie spoczynkowym to sygnał zmęczenia.</p>` : ''}</div>
    <div class="card"><h2>Tętno spoczynkowe</h2><canvas id="c-rhr"></canvas></div>
    <div class="card"><h2>Sen – wynik</h2><canvas id="c-sleep"></canvas></div>
    ${vo.length ? `<div class="card"><h2>VO₂max</h2><canvas id="c-vo2"></canvas></div>` : ''}`;
  },
  est() {
    const e = T.estimates(acts, set, today()), last = series[series.length - 1];
    const days = set.raceDate ? T.daysBetween(today(), set.raceDate) : 0;
    const avg4 = lastN(T.weekly(acts, set), 5).slice(0, 4).reduce((a, w) => a + w.tss, 0) / 4 || 0;
    const wtss = set.weeklyTss || Math.round(avg4);
    let fc = '';
    if (last && days > 0) {
      const f = T.forecast(last, wtss, days), r = f[f.length - 1];
      fc = `<p style="margin:10px 0 0">W dniu startu przy <b>${wtss} TSS/tydz.</b>: CTL <b>${Math.round(r.ctl)}</b>, ATL ${Math.round(r.atl)}, TSB <b>${Math.round(r.tsb)}</b>. <span class="mut">Taper (np. −40% przez ostatnie 10 dni) podniesie TSB.</span></p>`;
    }
    const tri = e.tri, rc = T.races(acts);
    const raceCard = rc.length ? `<div class="card"><h2>Twoje starty</h2>${rc.map(r => `<div class="act"><div class="ic" style="background:${COL.multi}">T</div><div style="min-width:0"><div class="n">${esc(r.act.name)}</div><div class="m">${r.act.date} · ${r.kind === 'IM' ? 'pełny dystans' : '70.3'} · ${f1(r.act.dist / 1000)} km</div></div><div class="t">${T.fmtTime(r.act.dur)}<small>czas</small></div></div>`).join('')}</div>` : '';
    const cal = tri && tri.calibration, cr = cal && series.find(x => x.d === cal.date), cn = series[series.length - 1];
    const formNote = cr && cn && cn.ctl < cr.ctl * 0.85 ? `Uwaga: to forma z okresu startowego (CTL ${Math.round(cr.ctl)}, teraz ${Math.round(cn.ctl)}), więc dziś wynik byłby wyraźnie słabszy. ` : '';
    return raceCard + `<div class="card"><h2>Biegi – szacunek z Riegela</h2>${e.run ? `<div class="grid">${kpi(T.fmtTime(e.run.t5), '5 km')}${kpi(T.fmtTime(e.run.t10), '10 km')}${kpi(T.fmtTime(e.run.thm), 'półmaraton')}${kpi(T.fmtTime(e.run.tm), 'maraton')}</div>
      <p class="mut" style="margin:10px 0 0">Na podstawie najlepszego wysiłku z 120 dni: ${esc(e.run.base.name || 'bieg')} (${e.run.base.date}, ${f1(e.run.base.dist / 1000)} km w ${T.fmtTime(e.run.base.dur)}). Trening w spokojnym tempie zaniża wynik.</p>` : '<p class="mut">Za mało danych biegowych (potrzeba biegu ≥ 3 km i ≥ 15 min w ostatnich 120 dniach).</p>'}</div>
    <div class="card"><h2>Ironman 70.3 – orientacyjnie</h2>${tri ? `<div class="grid">${kpi(T.fmtTime(tri.swim), 'pływanie 1,9 km', `<small class="mut">${T.fmtPace(tri.swimPace)}/100 m</small>`)}${kpi(T.fmtTime(tri.bike), 'rower 90 km', `<small class="mut">${f1(tri.bikeKmh)} km/h</small>`)}${kpi(T.fmtTime(tri.run), 'bieg 21,1 km')}${kpi(T.fmtTime(tri.total), 'razem (+T1/T2 5 min)')}</div>
      <p class="mut" style="margin:10px 0 0">${tri.calibration ? `Skalibrowane do Twojego startu ${tri.calibration.date} (wynik ${T.fmtTime(tri.calibration.actual)}, sam model dawał ${T.fmtTime(tri.calibration.model)}${tri.calibration.perLeg ? '' : ', bez podziału na etapy'}). ` : ''}${formNote}Model: pływanie z CSS (lub najlepszych 25% basenów) +4%, rower z szybszych jazd ≥ 40 km −3%, bieg to półmaraton +8%. To szacunek, a nie prognoza wyścigu: nie uwzględnia warunków, trasy ani żywienia.</p>` : '<p class="mut">Potrzebne dane ze wszystkich trzech dyscyplin (pływanie ≥ 400 m, jazda ≥ 40 km, bieg ≥ 3 km).</p>'}</div>
    <div class="card"><h2>Prognoza formy na start</h2>
      <label>Data startu</label><input type="date" id="race" value="${esc(set.raceDate)}">
      <label>Tygodniowy TSS do prognozy: <b id="wv">${wtss}</b></label><input type="range" id="wt" min="100" max="1000" step="10" value="${wtss}">
      ${fc}${days > 0 ? '<canvas id="c-fc" style="margin-top:10px"></canvas>' + legend([[COL_CTL, 'CTL'], [COL_ATL, 'ATL'], [COL_TSB, 'TSB']]) : '<p class="mut">Ustaw datę startu, aby zobaczyć projekcję.</p>'}</div>`;
  },
  set() {
    const f = (k, l, ph) => `<div><label>${l}</label><input type="number" inputmode="decimal" id="s-${k}" value="${set[k] || ''}" placeholder="${ph || ''}"></div>`;
    return `<div class="card"><h2>Progi treningowe</h2><p class="mut" style="margin:0">Z nich liczony jest TSS. Brak progu = fallback na tętno lub ~35 TSS/h.</p>
      <div class="two">${f('lthr', 'Tętno progowe LTHR [bpm]')}${f('rhr', 'Tętno spoczynkowe [bpm]')}${f('ftp', 'FTP rower [W]', '0 = z tętna')}${f('runThr', 'Tempo progowe biegu [s/km]', 'np. 270 = 4:30')}${f('css', 'CSS pływanie [s/100 m]', 'np. 95 = 1:35')}</div>
      <button class="btn" data-act="save">Zapisz progi</button></div>
    <div class="card"><h2>Dane z Garmina (GitHub)</h2>
      <p class="mut" style="margin:0">${cfg ? `Repo <b style="color:var(--txt)">${esc(cfg.repo)}</b>. ${raw.demo ? '' : 'Ostatnia aktualizacja: ' + esc((raw.updated || '').replace('T', ' ').slice(0, 16)) + '.'}` : 'Tryb demo – dane przykładowe. Podłącz repo, do którego workflow zapisuje <code>triathlon/data/garmin.json</code>.'}${status ? `<br><span class="down">${esc(status)}</span>` : ''}</p>
      ${cfg ? `<button class="btn" data-act="reload">Odśwież dane</button><button class="btn sec" data-act="widget">Zaktualizuj widżet</button><button class="btn sec red" data-act="off">Odłącz GitHub</button>` : `
      <label>Repo (nick/nazwa)</label><input type="text" id="gh-repo" placeholder="nick/repo" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label>Token (Contents: Read and write)</label><input type="text" id="gh-tok" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
      <button class="btn" data-act="on">Połącz</button>`}</div>`;
  },
};
const COL_CTL = '#38bdf8', COL_ATL = '#ff7a1a', COL_TSB = '#a78bfa';

function avg7(arr) { return arr.map((_, i) => { const s = arr.slice(Math.max(0, i - 6), i + 1).filter(v => v != null); return s.length >= 3 ? s.reduce((a, b) => a + b, 0) / s.length : null; }); }

const charts = {
  form() {
    const s = lastN(series, 90), lb = s.map(x => short(x.d));
    lineChart($('#c-pmc'), lb, [{ v: s.map(x => x.ctl), color: COL_CTL, w: 2.5 }, { v: s.map(x => x.atl), color: COL_ATL }, { v: s.map(x => x.tsb), color: COL_TSB }]);
    const wk = lastN(T.weekly(acts, set), 12);
    barChart($('#c-wk'), wk.map(w => short(w.week)), [{ v: wk.map(w => w.swim), color: COL.swim }, { v: wk.map(w => w.bike), color: COL.bike }, { v: wk.map(w => w.run), color: COL.run }, { v: wk.map(w => w.multi), color: COL.multi }]);
  },
  rec() {
    const w = lastN(wellness, 60), lb = w.map(x => short(x.date)), h = w.map(x => x.hrv);
    lineChart($('#c-hrv'), lb, [{ v: h, color: '#a78bfa', dots: true, w: 1, alpha: .6 }, { v: avg7(h), color: '#eef0f4', w: 2.5 }]);
    lineChart($('#c-rhr'), lb, [{ v: w.map(x => x.rhr), color: '#ff6b6b', dots: true, w: 1 }, { v: avg7(w.map(x => x.rhr)), color: '#eef0f4', w: 2.5 }]);
    lineChart($('#c-sleep'), lb, [{ v: w.map(x => x.sleep), color: '#38bdf8', dots: true, w: 1 }, { v: avg7(w.map(x => x.sleep)), color: '#eef0f4', w: 2.5 }]);
    if ($('#c-vo2')) lineChart($('#c-vo2'), lb, [{ v: w.map(x => x.vo2), color: '#2fbf71', w: 2.5 }]);
  },
  est() {
    const cv = $('#c-fc'), last = series[series.length - 1]; if (!cv || !last) return;
    const days = T.daysBetween(today(), set.raceDate), past = lastN(series, 42);
    const f = T.forecast(last, +$('#wt').value, days), all = past.concat(f.map((x, i) => ({ d: T.addDays(today(), x.i), ctl: x.ctl, atl: x.atl, tsb: x.tsb })));
    lineChart(cv, all.map(x => short(x.d)), [{ v: all.map(x => x.ctl), color: COL_CTL, w: 2.5 }, { v: all.map(x => x.atl), color: COL_ATL }, { v: all.map(x => x.tsb), color: COL_TSB }], { vline: past.length - 1 });
  },
};

function render() {
  $('#nav').innerHTML = TABS.map(([k, i, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}"><b>${i}</b>${l}</button>`).join('');
  const title = TABS.find(t => t[0] === tab)[2];
  const ts = raw && raw.updated ? raw.updated.replace('T', ' ').slice(0, 16) : '';
  $('#app').innerHTML = `<h1>${title}</h1><p class="sub">${raw && raw.demo ? 'Dane demonstracyjne' : 'Garmin Connect · ' + esc(ts)}</p>` +
    (raw && raw.demo ? '<div class="banner">Pokazuję dane przykładowe. Podłącz repo w zakładce Ustawienia, żeby zobaczyć własne treningi.</div>' : '') +
    (status ? `<div class="banner">${esc(status)} – pokazuję ostatnie zapisane dane.</div>` : '') + views[tab]();
  if (charts[tab]) requestAnimationFrame(charts[tab]);
}

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('on'), 2400); }

function saveSet(patch) { set = Object.assign(set, patch); store.set('tri_set', set); compute(); }

document.addEventListener('click', async e => {
  const nb = e.target.closest('[data-tab]');
  if (nb) { tab = nb.dataset.tab; store.set('tri_tab', tab); render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'save') {
    const p = {}; ['lthr', 'rhr', 'ftp', 'runThr', 'css'].forEach(k => p[k] = +$('#s-' + k).value || 0);
    if (!p.lthr || p.rhr >= p.lthr) return toast('LTHR musi być większe od tętna spoczynkowego');
    saveSet(p); toast('Zapisano'); render();
  } else if (act === 'on') {
    const repo = $('#gh-repo').value.replace(/\s/g, ''), token = $('#gh-tok').value.replace(/\s/g, '');
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return toast('Podaj repo (nick/nazwa) i token');
    cfg = { repo, token }; store.set('tri_gh', cfg); toast('Łączę…'); loadData(true);
  } else if (act === 'reload') { toast('Odświeżam…'); loadData(true); }
  else if (act === 'widget') publishSummary(false);
  else if (act === 'off') { if (confirm('Odłączyć GitHub? Przełączę na dane demo.')) { cfg = null; store.del('tri_gh'); store.del('tri_data'); loadData(); } }
});

document.addEventListener('input', e => {
  if (e.target.id === 'wt') { $('#wv').textContent = e.target.value; charts.est(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'race') { saveSet({ raceDate: e.target.value }); render(); }
  if (e.target.id === 'wt') { saveSet({ weeklyTss: +e.target.value }); render(); }
});
window.addEventListener('resize', () => charts[tab] && charts[tab]());

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
loadData(false);
</script>
</body>
</html>
